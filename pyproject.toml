[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-firewall"
version = "0.0.1"
description = "Agent-agnostic prompt-injection defense proxy for the Model Context Protocol (MCP)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Atul Chaurasia" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "pyyaml>=6.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
bench = [
    "langgraph",
    "langchain-mcp-adapters",
    "pandas",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
